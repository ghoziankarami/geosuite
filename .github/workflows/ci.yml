name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Desktop origin and handoff contract
        run: python tests/test_desktop_bridge.py

      - name: Build all three modules
        run: npm run build

      - name: Node known-answer and import tests
        run: npm test

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: End-to-end known-answer test (Core -> Assay -> Resource)
        run: |
          python -m http.server 8767 -d dist >/dev/null 2>&1 &
          python -m http.server 8768 -d dist >/dev/null 2>&1 &
          python -m http.server 8769 -d dist >/dev/null 2>&1 &
          sleep 2
          python tests/test_pipeline_known_answer.py
          python tests/test_lab_conventions.py
          python tests/test_estimation_inputs.py
          python tests/test_module_handoff.py

      - name: CSV import matches committed parser snapshots
        run: python tests/known-answer/csv-parser-characterization.py

      - name: Tutorials on real data still match the app (docs/vignettes)
        run: python tests/test_vignettes.py

      - name: Installable offline app (macOS / Linux route)
        run: |
          python tests/test_pwa_install.py
          python tests/test_pwa_subpath.py
          python tests/test_update_and_links.py

      - name: Upload built modules
        uses: actions/upload-artifact@v4
        with:
          name: geosuite-dist
          path: dist/*.html

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned desktop build dependencies
        run: python -m pip install -r desktop/requirements.txt
      - name: Build source ZIP layout on Windows
        run: npm run build
      - name: Verify all modules and bundled vendor assets
        shell: pwsh
        run: |
          @('Core.html', 'Assay.html', 'Resource.html', 'vendor/plotly.min.js', 'manifest.webmanifest') | ForEach-Object {
            if (-not (Test-Path (Join-Path dist $_))) { throw "Missing dist/$_" }
          }
      - name: Run dependency-free tests
        run: |
          npm test
          python tests/test_desktop_bridge.py
