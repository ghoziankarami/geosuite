name: Release (Windows EXE)

# Builds the three Desktop Edition EXEs on a GitHub-hosted Windows runner and
# attaches them to the GitHub Release for the tag. Pushing a tag vX.Y.Z is the
# whole release step, so it works from any machine, including a Mac.
#
#   git tag v3.0.1 && git push origin v3.0.1
#
# If a release for the tag already exists (e.g. created with hand-written
# notes), the EXEs are added to it; otherwise one is created with generated
# notes. Re-run for an existing tag via "Run workflow" (workflow_dispatch).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach, e.g. v3.0.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-exe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      PYTHONIOENCODING: utf-8
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: desktop/requirements.txt

      - name: Tag matches package.json version
        shell: bash
        run: |
          VER="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag $TAG does not match package.json version $VER"
            exit 1
          fi

      - name: Install build dependencies
        run: python -m pip install -r desktop/requirements.txt

      - name: Build Core, Assay, Resource
        run: python desktop/build_exe.py Core Assay Resource

      - name: Verify the EXEs (version, bundled files, no licence modules)
        working-directory: desktop
        run: python verify-exe-build.py

      - name: Checksums
        shell: bash
        working-directory: desktop/dist
        run: sha256sum Orebit-*.exe > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Attach to the GitHub Release
        shell: bash
        run: |
          cd desktop/dist
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "GeoSuite $TAG" --generate-notes
          fi
          gh release upload "$TAG" Orebit-Core.exe Orebit-Assay.exe Orebit-Resource.exe SHA256SUMS.txt --clobber

      - name: Keep the EXEs as a workflow artifact too
        uses: actions/upload-artifact@v4
        with:
          name: geosuite-exe-${{ env.TAG }}
          path: desktop/dist/*
