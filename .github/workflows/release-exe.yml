name: Release (Windows EXE)

# Builds the three Desktop Edition EXEs on a GitHub-hosted Windows runner and
# attaches them to the GitHub Release for the tag. Pushing a tag vX.Y.Z is the
# whole release step, so it works from any machine, including a Mac.
#
#   git tag v3.0.1 && git push origin v3.0.1
#
# If a release for the tag already exists (e.g. created with hand-written
# notes), the EXEs are added to it; otherwise one is created with generated
# notes. Published assets are immutable: existing names make upload fail.
# Use a new version tag to replace a published build.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach, e.g. v3.0.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release-exe-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  exe:
    permissions:
      contents: write
      checks: read
      actions: read
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      PYTHONIOENCODING: utf-8
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: desktop/requirements.txt

      - name: Tag matches package.json version
        shell: bash
        run: |
          VER="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag $TAG does not match package.json version $VER"
            exit 1
          fi

      - name: Exact tagged source has completed trusted CI on main
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python build/verify-release-source.py --tag "$TAG"

      - name: Install build dependencies
        run: python -m pip install -r desktop/requirements.txt

      - name: Build Core, Assay, Resource
        run: python desktop/build_exe.py Core Assay Resource

      - name: Package and verify the local web distribution
        shell: bash
        run: |
          python build/package_web.py --output desktop/dist --source-ref "$(git rev-parse HEAD)"
          python tests/test_web_package.py

      - name: Verify the EXEs (version, bundled files, no licence modules)
        working-directory: desktop
        run: python verify-exe-build.py

      - name: Record resolved Python dependencies
        shell: bash
        run: |
          python -VV > desktop/dist/PYTHON-DEPENDENCIES.txt
          python -m pip freeze >> desktop/dist/PYTHON-DEPENDENCIES.txt

      - name: Checksums
        shell: bash
        working-directory: desktop/dist
        run: sha256sum Orebit-*.exe geosuite-*-web.zip > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Attach to the GitHub Release
        shell: bash
        run: |
          cd desktop/dist
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "GeoSuite $TAG" --generate-notes
          fi
          gh release upload "$TAG" Orebit-Core.exe Orebit-Assay.exe Orebit-Resource.exe geosuite-*-web.zip SHA256SUMS.txt PYTHON-DEPENDENCIES.txt

      - name: Keep the EXEs as a workflow artifact too
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: geosuite-exe-${{ env.TAG }}
          path: desktop/dist/*
